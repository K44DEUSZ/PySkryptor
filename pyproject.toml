[tool.ruff]
line-length = 120
indent-width = 2
target-version = "py312"

[tool.ruff.format]
indent-style = "space"
quote-style = "preserve"

[tool.ruff.lint]
select = [
  "E501",
  "F",
  "I",
]

[tool.ruff.lint.per-file-ignores]
"PySkryptor.spec" = ["F821"]
"AIModelHost.spec" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
